apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: httpbin-redirect-to-https
  namespace: johnny-droptables
spec:
  hostnames:
  - awesome.app.johnny
  parentRefs:
  - name: clustergateway
    namespace: kgateway-system
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301