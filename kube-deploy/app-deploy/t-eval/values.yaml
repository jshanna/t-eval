replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "awesomeappsvc"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: NodePort
  port: 80

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
  - name: clustergateway
    sectionName: http
    namespace: kgateway-system
  hostnames:
  - awesome.app
  rules:
  - backendRefs:
    - name: awesomeapp
      port: 80

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: homepage-host
    mountPath: ./html

volumeMounts:
  - name: homepage
    mountPath: /usr/share/nginx/html
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
