kind: Gateway
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: clustergateway
  namespace: kgateway-system
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-ca-issuer
spec:
  gatewayClassName: kgateway
  listeners:
  - protocol: HTTP
    port: 8080
    name: http
    allowedRoutes:
      namespaces:
        from: johnny-droptables
  - protocol: https
    port: 8443
    name: https
    hostname: awesome.app
    tls:
      mode: Terminate
      certificateRefs:
      - name: awsesome-cert
    allowRoutes:
      namespaces:
        from: johnny-droptables