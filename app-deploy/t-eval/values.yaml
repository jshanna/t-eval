replicaCount: 1
image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: 1.28.0
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: "awesomeappsvc"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80

httpRoute:
  enabled: true
  annotations: {}
  parentRefs:
  - name: clustergateway
    sectionName: https
    namespace: kgateway-system
  hostnames:
  - awesome.app.johnny
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

volumes:
  - name: homepage
    configMap:
      name: awesomeapp-index

volumeMounts:
  - name: homepage
    mountPath: /usr/share/nginx/html
    readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
